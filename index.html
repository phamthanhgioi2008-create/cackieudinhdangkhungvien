<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rectangles</title>
    <style>
        .Outside{
            border: 3px dotted blue;
            border-radius: 10px;
            padding: 10px;
        }
        .Middle{
            border: 3px dashed red;
            border-radius: 10px;
            padding: 10px;
        }
        .Inner{
            border: 3px solid green;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="Outside">
        <div class="Middle">
            <div class="Inner">
                I am heavily packed <br>
                &ltDIV&gt
            </div>
        </div>
    </div>
    
</body>
</html>
